version: v2

plugins:
  - remote: buf.build/protocolbuffers/go
    out: go
    opt:
      - module=github.com/authaas/api

  # - remote: buf.build/connectrpc/go:v2.0.0
  - local: protoc-gen-connect-go
    out: go
    opt:
      - module=github.com/authaas/api

  - remote: buf.build/bufbuild/es
    out: es
    opt:
      - target=ts
      - import_extension=ts
